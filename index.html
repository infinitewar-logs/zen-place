<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zen Place</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        /* This creates your smooth background gradient */
        background: linear-gradient(135deg, #1e1b4b 0%, #24d7eb 100%);
        height: 100vh;
        width: 100vw;
      }
      canvas {
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1; /* Sits cleanly on top of the background gradient */
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <script type="module" src="app.js"></script>
  </body>
</html>
